name: Reusable verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.platform }} / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
            compiler: GCC
            cc: gcc
            cxx: g++
            build_type: Debug
          - os: ubuntu-latest
            platform: Linux
            compiler: GCC
            cc: gcc
            cxx: g++
            build_type: Release
          - os: ubuntu-latest
            platform: Linux
            compiler: Clang
            cc: clang
            cxx: clang++
            build_type: Debug
          - os: ubuntu-latest
            platform: Linux
            compiler: Clang
            cc: clang
            cxx: clang++
            build_type: Release
          - os: windows-latest
            platform: Windows
            compiler: MSVC
            cc: cl
            cxx: cl
            build_type: Debug
          - os: windows-latest
            platform: Windows
            compiler: MSVC
            cc: cl
            cxx: cl
            build_type: Release
          - os: macos-latest
            platform: macOS
            compiler: AppleClang
            cc: clang
            cxx: clang++
            build_type: Debug
          - os: macos-latest
            platform: macOS
            compiler: AppleClang
            cc: clang
            cxx: clang++
            build_type: Release
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MSVC developer command prompt
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found at $vswhere"
          }

          $installationPath = & $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installationPath) {
            throw 'A Visual Studio installation with the MSVC toolchain was not found'
          }

          $devCmd = Join-Path $installationPath 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path $devCmd)) {
            throw "VsDevCmd.bat was not found at $devCmd"
          }

          $originalEnvironment = @{}
          Get-ChildItem Env: | ForEach-Object {
            $originalEnvironment[$_.Name] = $_.Value
          }

          $environment = & $env:ComSpec /d /s /c `
            "call `"$devCmd`" -no_logo -arch=amd64 -host_arch=amd64 && set"
          if ($LASTEXITCODE -ne 0) {
            throw "VsDevCmd.bat failed with exit code $LASTEXITCODE"
          }

          foreach ($line in $environment) {
            if ($line -notmatch '^([^=][^=]*)=(.*)$') {
              continue
            }

            $name = $Matches[1]
            $value = $Matches[2]
            if (-not $originalEnvironment.ContainsKey($name) -or
                $originalEnvironment[$name] -ne $value) {
              "$name=$value" | Out-File -FilePath $env:GITHUB_ENV `
                -Encoding utf8 -Append
            }
          }

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DSLABJSON_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: >-
          ctest --test-dir build
          --build-config ${{ matrix.build_type }}
          --output-on-failure

  sanitizer:
    name: Linux / Clang / ASan+UBSan
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DSLABJSON_BUILD_TESTS=ON
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  no-exceptions-no-rtti:
    name: Linux / GCC / no exceptions or RTTI
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DSLABJSON_BUILD_TESTS=ON
          -DSLABJSON_ENABLE_EXCEPTIONS=OFF
          "-DCMAKE_CXX_FLAGS=-fno-exceptions -fno-rtti"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  exceptions-enabled:
    name: Linux / GCC / exceptions enabled
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DSLABJSON_BUILD_TESTS=ON
          -DSLABJSON_ENABLE_EXCEPTIONS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  lto:
    name: Linux / GCC / Release LTO
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSLABJSON_BUILD_TESTS=ON
          -DSLABJSON_ENABLE_LTO=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
